# Listen on IPv4 only
listen=YES
listen_ipv6=NO

# Enable anonymous FTP login
anonymous_enable=YES
anon_root=/home/ftp/anonymous

# Disable anonymous upload and directory creation
anon_upload_enable=NO
anon_mkdir_write_enable=NO
no_anon_password=YES

# Enable local users
local_enable=YES
write_enable=YES

# Chroot local users to home directory
chroot_local_user=YES
allow_writeable_chroot=YES

# File permissions mask
local_umask=022

# Secure chroot dir
secure_chroot_dir=/var/run/vsftpd/empty

# Logging
xferlog_enable=YES
xferlog_file=/var/log/vsftpd.log
xferlog_std_format=YES

# Active mode
connect_from_port_20=YES

# Passive mode config
pasv_enable=YES
pasv_min_port=30000
pasv_max_port=30009
pasv_address=0.0.0.0

# Disable SSL/TLS for ease of use in challenge
ssl_enable=NO
